<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<script src="__DATA_SRC__"></script>
<style>
/* SECTION: base */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{background:#000;overflow-x:hidden;overscroll-behavior:none}
#snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
#field{position:relative;z-index:2}
/* 无整层幕布：星尘即刻可见，图块各自淡入。
   旧机制（opacity:0 → .revealed 掀幕）在首屏图未及时到达时只能靠盲超时揭幕，
   观感是「先纯黑很久，然后图片一张张蹦」。保留 .revealed 规则以兼容外部钩子调用。 */
#field.revealed{opacity:1}
/* SECTION: tiles — 深羽化 + 黑点提升：图像暗部直接落入页面纯黑，矩形边完全消隐 */
.tile{position:absolute;left:0;top:0;will-change:transform;cursor:pointer}
.tile .body{position:relative;width:100%;height:100%;overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.9,.25,1);
  -webkit-mask-image:radial-gradient(115% 115% at 50% 50%, #000 55%, rgba(0,0,0,.45) 80%, transparent 97%);
  mask-image:radial-gradient(115% 115% at 50% 50%, #000 55%, rgba(0,0,0,.45) 80%, transparent 97%)}
.tile img{display:block;width:100%;height:100%;object-fit:fill;  /* 原始比例，无裁切 */
  filter:brightness(.92) contrast(1.06);
  opacity:0;transition:opacity .7s ease,filter .5s ease}
.tile img.in{opacity:1}                                   /* 各自到齐后独立淡入 */
.tile:hover{z-index:60}
.tile:hover .body{transform:scale(1.1)}
.tile:hover img{filter:brightness(1) contrast(1.02)}
/* SECTION: lightbox */
#lb{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.92);opacity:0;pointer-events:none;transition:opacity .4s ease}
#lb.open{opacity:1;pointer-events:auto}
#lb .frame{max-width:min(96vw,1400px);text-align:center}
#lb img{max-width:100%;max-height:92vh;width:auto;border-radius:6px;
  box-shadow:0 30px 90px rgba(0,0,0,.9)}
#lb .spin{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px;
  border:2px solid rgba(130,210,255,.25);border-top-color:#8fd8ff;border-radius:50%;
  opacity:0;transition:opacity .2s}
#lb.loading .spin{opacity:1}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="field" aria-hidden="true"></div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="spin"></div>
  <div class="frame"><img id="lb-img" alt=""></div>
</div>
<script>
"use strict";
/* SECTION: independent drift — 每张图自己的李萨如航迹：
   1) 紧密随机放置（只预留呼吸 gap，无轨道预留 → 不稀疏）
   2) 放置后量出每图四方向实际空档，轨道半径 = 空档对半分（几何上
      双方相向漂到极限也只是相切 → 任何帧零重叠，无需共享平移）
   3) 空档大的漂得远，挤的地方微动——振幅天然参差，航向各自独立 */
const DATA = (window.PLAYGROUND_DATA && window.PLAYGROUND_DATA.records) || window.BW_DATA || [];
const FIELD = document.getElementById("field");
const MOBILE = innerWidth < 720;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a,b)=>a+Math.random()*(b-a);
/* CONFIG — v23 基线默认值；覆盖优先级：data.config > 此处默认 */
const CFG = Object.assign({
  E: MOBILE ? 4 : 6,              /* 上下边缘安全距 */
  MX: MOBILE ? 24 : 70,           /* 左右禁飞区：图块与漂移轨道永不进入 */
  RCAP: MOBILE ? 26 : 46,         /* 轨道半径上限 */
  RES: MOBILE ? 10 : 15,          /* 每侧最小跑道 */
  loF: MOBILE ? 0.228 : 0.113,    /* 尺寸带下限（视口宽占比） */
  hiF: MOBILE ? 0.26 : 0.143,     /* 尺寸带上限 */
  heightCap: MOBILE ? 0.42 : 0.42,/* 竖图高度帽（视口高占比） */
  voidRatio: 1.5,                 /* 画布空隙率（越小越密） */
  bandsPerScreen: 3,              /* 纵向带数 = 屏数 × 此值 */
  clusterBias: 0.6,               /* 聚簇偏置概率 */
  gapMin: 6, gapSpan: 8,          /* 呼吸间距 = gapMin + hash*gapSpan */
  wxLo: 0.05, wxHi: 0.22,         /* 漂移角频率范围 */
  wyLo: 0.04, wyHi: 0.2,
  rotSpan: 6, rotAmp: 2.8,        /* 静态摆角与摆动幅度 */
  rwLo: 0.03, rwHi: 0.09,
  dustN: 460, sparkleN: 46,       /* 星尘数量（桌面基准） */
  dustScaleMobile: 0.45,
  revealTimeout: 5000,            /* 兜底：仅防首屏图全部失败时卡死揭幕钩子 */
  /* —— 分级加载：只影响「何时开始下载」，不影响布局坐标与运动，故 v23 几何等价性不变 —— */
  loadConcurrency: MOBILE ? 4 : 6,/* 并发上限，对齐浏览器同域连接数，避免长队互堵 */
  lazyMargin: 1.0,                /* 懒加载提前量（视口高倍数），滚动前提前取下方图 */
  morph: 0,                       /* 0=与 v23 逐帧一致；>0=向目标锚点插值（重组用） */
  morphSpeed: 0.9                 /* 插值收敛速度（1/秒） */
}, (window.PLAYGROUND_DATA && window.PLAYGROUND_DATA.config) || {});
const E = CFG.E, MX = CFG.MX, RCAP = CFG.RCAP;
function screenScale(d){
  if(!d.box) return 0.62;
  const f = Math.max(d.box[2]-d.box[0], (d.box[3]-d.box[1])*0.75);
  return Math.min(1.15, Math.max(0.55, 0.6 / Math.max(f, 0.18)));
}
/* 字段兼容：新版 src/full，旧版 u/fu */
for (const d of DATA) { if (!d.src && d.u) d.src = d.u; if (!d.full && d.fu) d.full = d.fu; }
const tiles = DATA.map((d,i)=>{
  const el = document.createElement("figure");
  el.className = "tile";
  el.dataset.id = d.id;
  el.innerHTML = `<div class="body"><img data-image="${d.src}" alt="${d.id}"></div>`;
  const img = el.querySelector("img");
  img.addEventListener("load", () => { img.classList.add("in"); settleIn(d.id); });
  img.addEventListener("error", () => { img.remove(); el.querySelector(".body").classList.add("dead"); settleIn(d.id); });
  /* 不在此处赋 src：加载时机由 layout() 后的编排器决定（首屏优先 + 滚动懒加载）。
     历史教训：曾在此「全部立即加载」，N 张 MB 级原图一次性占满浏览器 6 条连接，
     首屏图迟迟不到 → revealTimeout 盲兜底掀开幕布 → 用户看到纯黑背景后图片一张张蹦出。 */
  el.addEventListener("click", () => openLB(d));
  FIELD.appendChild(el);
  const hash = Math.abs(Math.sin(i * 12.9898) % 1);
  return { el, d, i, hash, id: d.id,
    attrs: d.attrs || {},                                 /* 任意业务数据，引擎只透传不解释 */
    rx: 0, ry: 0, ox: 0, oy: 0,
    wx: rnd(CFG.wxLo, CFG.wxHi), wy: rnd(CFG.wyLo, CFG.wyHi),
    phx: rnd(0, 6.28), phy: rnd(0, 6.28),
    rot: rnd(-CFG.rotSpan, CFG.rotSpan), rw: rnd(CFG.rwLo, CFG.rwHi), rph: rnd(0, 6.28),
    w: 0, h: 0, cx: 0, cy: 0, tx: null, ty: null,          /* tx/ty = 重组目标锚点 */
    px: 0, py: 0 };
});
/* SECTION: layout */
let _sortKey = null;                    /* 外部注入的重组排序键 */
function layout(){
  const W = innerWidth, VH = innerHeight;
  /* 1. 定尺寸：桌面 162–206px 带内随机（下限+20%，上限不变），手机 89–101px */
  const loF = CFG.loF, hiF = CFG.hiF;
  for (const t of tiles) {
    const ratio = (t.d.h || 3) / (t.d.w || 4);
    let w = Math.round(W * (loF + (hiF - loF) * t.hash) * (0.82 + 0.36 * (screenScale(t.d) - 0.55)));
    w = Math.min(Math.max(w, Math.round(W * loF)), Math.round(W * hiF));
    let h = Math.round(w * ratio);
    const hCap = Math.round(VH * CFG.heightCap);
    if (h > hCap) { h = hCap; w = Math.max(1, Math.round(h / ratio)); }
    t.w = w; t.h = h;
    t.gap = CFG.gapMin + Math.round(t.hash * CFG.gapSpan);                 // 呼吸间距 6–14px
    t.el.style.width = w + "px"; t.el.style.height = h + "px";
  }
  /* 2. 画布高度：占位面积 × 空隙率；固定 H0 作带基准，杜绝扩容下移 */
  const RES = CFG.RES;                                 // 每侧最小跑道
  let area = 0;
  for (const t of tiles) area += (t.w + t.gap + 2 * (E + RES)) * (t.h + t.gap + 2 * (E + RES));
  let H0 = Math.max(VH * 2.2, Math.min(VH * 9, area * CFG.voidRatio / W));
  const fits = (x, y, t) => {
    if (x < MX || y < E + RES || x + t.w > W - MX || y + t.h > H0 - E - RES) return false;
    for (const p of tiles) {
      if (p === t || !p.placed) continue;
      const bx = (t.gap + p.gap) / 2 + 2 * RES, by = bx;
      if (x - bx < p.cx + p.w && p.cx - bx < x + t.w &&
          y - by < p.cy + p.h && p.cy - by < y + t.h) return false;
    }
    return true;
  };
  /* 3. 放置顺序：默认大 → 小；注入 _sortKey 时可按业务键重组（同键连续 → 同带聚拢） */
  const order = tiles.slice().sort((a, b) => {
    if (_sortKey) {
      const ka = String(_sortKey(a)), kb = String(_sortKey(b));
      if (ka !== kb) return ka < kb ? -1 : 1;
    }
    return (b.w * b.h) - (a.w * a.h);
  });
  const BANDS = Math.max(10, Math.round(H0 / VH * CFG.bandsPerScreen));
  const placedArr = [];
  order.forEach((t, oi) => {
    t.placed = false;
    const band = oi % BANDS, bandH = H0 / BANDS;
    let ok = false;
    for (let k = 0; k < 800 && !ok; k++) {
      let x, y;
      if (placedArr.length && Math.random() < CFG.clusterBias) {
        const p = placedArr[(Math.random() * placedArr.length) | 0];
        x = p.cx + p.w / 2 + rnd(-1.3, 1.3) * (p.w / 2 + t.w / 2 + 14) - t.w / 2;
        y = p.cy + p.h / 2 + rnd(-1.2, 1.2) * (p.h / 2 + t.h / 2 + 14) - t.h / 2;
      } else {
        x = rnd(MX, W - t.w - MX);
        y = rnd(Math.max(E + RES, band * bandH - bandH * 0.45),
                Math.min(H0 - t.h - E - RES, (band + 1) * bandH + bandH * 0.45) + 1);
      }
      x = Math.min(Math.max(MX, x), Math.max(MX, W - t.w - MX));
      y = Math.min(Math.max(E + RES, y), H0 - t.h - E - RES);
      if (fits(x, y, t)) { t.cx = Math.round(x); t.cy = Math.round(y); ok = true; }
    }
    if (!ok) {                                          // 兜底：全卷逐行找位
      for (let fy = E + RES; fy <= H0 - t.h - E - RES && !ok; fy += Math.max(18, Math.round(t.h * 0.35)))
        for (let fx = MX; fx + t.w <= W - MX; fx += Math.max(20, Math.round(t.w * 0.45)))
          if (fits(fx, fy, t)) { t.cx = fx; t.cy = fy; ok = true; break; }
    }
    if (!ok) { t.cx = MX; t.cy = H0 + 30; H0 = t.cy + t.h + 60; }   // 延底垫放，不重叠
    t.placed = true; placedArr.push(t);
  });
  /* 3.5 自愈：锚点框若有交叠（兜底垫放等），逐张重放后 intersect 者 */
  for (let round = 0; round < 4; round++) {
    let dirty = false;
    for (let i = 0; i < tiles.length; i++) for (let j = i + 1; j < tiles.length; j++) {
      const a = tiles[i], b = tiles[j];
      if (b.cy < a.cy + a.h && a.cy < b.cy + b.h &&
          b.cx < a.cx + a.w && a.cx < b.cx + b.w) {
        dirty = true; b.placed = false;
        let ok2 = false;
        for (let fy = E + RES; fy <= H0 - b.h - E - RES && !ok2; fy += 24)
          for (let fx = MX; fx + b.w <= W - MX; fx += 24)
            if (fits(fx, fy, b)) { b.cx = fx; b.cy = fy; ok2 = true; break; }
        if (!ok2) { b.cx = MX; b.cy = H0 + 30; H0 = b.cy + b.h + 60; }
        b.placed = true;
      }
    }
    if (!dirty) break;
  }
  /* 4. 轨道预算（图框级·不动点迭代）：任意时刻任何两张图的矩形框零相交。
     规则：静止已在某轴相交的对 → 用另一轴静态间隙/2 锁死该轴预算；
     两轴皆有正间隙的对 → 仅当"漂移可达投影"在该轴重叠才约束另一轴。
     迭代至不动点后钳边距（只会再收缩）→ 保证始终成立。 */
  for (const t of tiles) { t.bR = t.bL = t.bD = t.bU = RCAP; }
  for (let pass = 0; pass < 8; pass++) {
    let changed = false;
    const cut = (t, k, q) => { if (t[k] > q) { t[k] = q; changed = true; } };
    for (let i = 0; i < tiles.length; i++) for (let j = i + 1; j < tiles.length; j++) {
      const a = tiles[i], b = tiles[j];
      const gapX = (b.cx >= a.cx) ? b.cx - (a.cx + a.w) : a.cx - (b.cx + b.w);
      const gapY = (b.cy >= a.cy) ? b.cy - (a.cy + a.h) : a.cy - (b.cy + b.h);
      if (gapX <= 0) {                                   /* x 已交叠 → y 永不相交 */
        const q = Math.max(0, gapY / 2);
        if (b.cy >= a.cy) { cut(a, "bD", q); cut(b, "bU", q); }
        else { cut(a, "bU", q); cut(b, "bD", q); }
        continue;
      }
      if (gapY <= 0) {                                   /* y 已交叠 → x 永不相交 */
        const q = Math.max(0, gapX / 2);
        if (b.cx >= a.cx) { cut(a, "bR", q); cut(b, "bL", q); }
        else { cut(a, "bL", q); cut(b, "bR", q); }
        continue;
      }
      const aB = a.cy + a.h + a.bD, aT = a.cy - a.bU, bB = b.cy + b.h + b.bD, bT = b.cy - b.bU;
      const aR2 = a.cx + a.w + a.bR, aL2 = a.cx - a.bL, bR2 = b.cx + b.w + b.bR, bL2 = b.cx - b.bL;
      if (bT < aB && aT < bB) {                          /* y 可达重叠 → x 预算=间隙/2 */
        const q = gapX / 2;
        if (b.cx >= a.cx) { cut(a, "bR", q); cut(b, "bL", q); }
        else { cut(a, "bL", q); cut(b, "bR", q); }
      }
      if (bL2 < aR2 && aL2 < bR2) {                      /* x 可达重叠 → y 预算 */
        const q = gapY / 2;
        if (b.cy >= a.cy) { cut(a, "bD", q); cut(b, "bU", q); }
        else { cut(a, "bU", q); cut(b, "bD", q); }
      }
    }
    if (!changed) break;
  }
  const W2 = innerWidth;
  for (const t of tiles) {
    const edgeR = Math.max(0, W2 - MX - (t.cx + t.w)), edgeL = Math.max(0, t.cx - MX);
    const edgeD = Math.max(0, H0 - E - (t.cy + t.h)), edgeU = Math.max(0, t.cy - E);
    const L = Math.min(t.bL, edgeL), R = Math.min(t.bR, edgeR);
    const U = Math.min(t.bU, edgeU), D = Math.min(t.bD, edgeD);
    t.rx = Math.round(Math.min(L, R)); t.ox = Math.round((R - L) / 2);  // 中点表示 ⊂ [cx−L, cx+R]
    t.ry = Math.round(Math.min(U, D)); t.oy = Math.round((D - U) / 2);
    t.el.style.zIndex = String(1000 - t.w);
  }
  FIELD.style.height = Math.round(H0) + "px";
  foldIds = tiles.filter(t => t.cy < VH * 1.25).map(t => t.d.id);
}
/* SECTION: motion — 锚点 + 各自相位/频率/半径的李萨如（预算已保证图框零相交）；
   保险丝推挤仅作兜底，推挤后强制钳回预算框，绝不越出保证 */
let _last = 0;
function advance(s, dt){
  dt = dt || Math.min(.05, s - _last) || 0.016; _last = s;
  for (const t of tiles) {
    /* 重组过渡：有目标锚点且开启 morph 时向其插值，随后重算预算（外部调 relayoutBudget）*/
    if (t.tx !== null && CFG.morph > 0) {
      const k = 1 - Math.exp(-CFG.morphSpeed * CFG.morph * dt);
      t.cx += (t.tx - t.cx) * k; t.cy += (t.ty - t.cy) * k;
      if (Math.abs(t.tx - t.cx) < 0.6 && Math.abs(t.ty - t.cy) < 0.6) { t.cx = t.tx; t.cy = t.ty; t.tx = t.ty = null; }
    }
    t.px = t.cx + (t.ox || 0) + Math.sin(s * t.wx + t.phx) * t.rx;
    t.py = t.cy + (t.oy || 0) + Math.sin(s * t.wy + t.phy) * t.ry;
  }
  const W = innerWidth, H0 = parseFloat(FIELD.style.height) || innerHeight;
  for (let it = 0; it < 5; it++) {                    // 保险丝：图框投影同时相交才推挤
    let any = false;
    for (let i = 0; i < tiles.length; i++) {
      const a = tiles[i];
      for (let j = i + 1; j < tiles.length; j++) {
        const b = tiles[j];
        const penX = Math.min(a.px + a.w, b.px + b.w) - Math.max(a.px, b.px);
        if (penX <= 0) continue;
        const penY = Math.min(a.py + a.h, b.py + b.h) - Math.max(a.py, b.py);
        if (penY <= 0) continue;
        any = true;
        if (penX <= penY) {
          const push = (penX + 3) * 0.5;
          if (a.px <= b.px) { a.px -= push; b.px += push; } else { a.px += push; b.px -= push; }
        } else {
          const push = (penY + 3) * 0.5;
          if (a.py <= b.py) { a.py -= push; b.py += push; } else { a.py += push; b.py -= push; }
        }
      }
    }
    for (const t of tiles) {          // 钳回预算框（图框级保证的重述），并守禁飞区
      const mx0 = Math.max(MX, t.cx + (t.ox || 0) - t.rx), mx1 = Math.min(Math.max(MX, W - t.w - MX), t.cx + (t.ox || 0) + t.rx);
      const my0 = Math.max(E, t.cy + (t.oy || 0) - t.ry), my1 = Math.min(Math.max(E, H0 - t.h - E), t.cy + (t.oy || 0) + t.ry);
      t.px = Math.min(Math.max(mx0, t.px), Math.max(mx0, mx1));
      t.py = Math.min(Math.max(my0, t.py), Math.max(my0, my1));
    }
    if (!any) break;                  // 无相交即收敛（正常布局首帧即退出）
  }
}
let foldIds = [];
layout();
advance(0);
/* SECTION: staged loader — 首屏优先 + 视口外懒加载 + 并发受控
   旧机制在此处对全部 N 张一次性赋 src，浏览器仅约 6 条并发连接，
   首屏图排在长队之后；revealTimeout 盲兜底先掀幕 → 纯黑后图片一张张蹦。
   新机制：按「是否首屏」排优先级，逐批喂入，并发上限受控；
   每张到齐即独立淡入，幕布不再遮蔽，星尘从第一帧就在。 */
let revealed = false;
const need = { s: null };
function settleIn(id){
  if (!need.s || revealed) return;
  need.s.delete(id);
  if (need.s.size === 0) reveal();
}
function reveal(){ if (revealed) return; revealed = true; FIELD.classList.add("revealed");
  emit("reveal", { count: tiles.length }); }

const loader = {
  queue: [],            /* 待加载 tile，已按优先级排序 */
  inflight: 0,
  max: CFG.loadConcurrency,
  started: new WeakSet()
};
/* 优先级：首屏图块（foldIds）→ 其余按纵向位置从上到下 */
function primeQueue(){
  const fold = new Set(foldIds);
  loader.queue = tiles.slice().sort((a, b) => {
    const af = fold.has(a.d.id) ? 1 : 0, bf = fold.has(b.d.id) ? 1 : 0;
    if (af !== bf) return bf - af;                        // 首屏优先
    return a.cy - b.cy;                                   // 其余自上而下
  });
}
function startLoad(t){
  if (loader.started.has(t)) return;
  loader.started.add(t);
  const img = t.el.querySelector("img");
  if (!img) return;                                       // error 分支可能已移除
  img.src = img.dataset.image;
}
function pump(){
  while (loader.inflight < loader.max && loader.queue.length) {
    const t = loader.queue.shift();
    loader.inflight++;
    const img = t.el.querySelector("img");
    const done = () => { loader.inflight--; pump(); };
    if (img) { img.addEventListener("load", done, { once: true });
               img.addEventListener("error", done, { once: true }); }
    else done();
    startLoad(t);
  }
}
primeQueue();
pump();
function armReveal(){ need.s = new Set(foldIds); settleIn("__probe__"); }
armReveal();
/* 兜底仍保留，但职责收窄：仅防「首屏图全部失败/挂起」时卡死揭幕钩子；
   正常路径下揭幕由首屏图到齐驱动，不再依赖超时猜时机。 */
setTimeout(reveal, CFG.revealTimeout);
/* 滚动到下方时，把尚未加载的图块提到队首，避免用户滚到空白区才现图 */
let _lazyT = 0;
function lazyPrime(){
  const now = performance.now();
  if (now - _lazyT < 200) return;                         // 节流：滚动事件高频
  _lazyT = now;
  const lo = scrollY - innerHeight * CFG.lazyMargin, hi = scrollY + innerHeight * (1 + CFG.lazyMargin);
  const pend = loader.queue.filter(t => t.cy >= lo && t.cy <= hi);
  if (!pend.length) return;
  const set = new Set(pend);
  loader.queue = pend.sort((a, b) => a.cy - b.cy)
    .concat(loader.queue.filter(t => !set.has(t)));
}
addEventListener("scroll", lazyPrime, { passive: true });
/* SECTION: stardust snow — 纯白锐利微粒：无任何失焦柔斑与前景脏点。
   细尘 + 稀疏亮点两档，亮度参差、缓慢呼吸，星空感但不画"星星"图形 */
const cv = document.getElementById("snow"), ctx = cv.getContext("2d");
let dust = [], sparkle = [];
function mkP(rLo, rHi, oLo, oHi, vLo, vHi){
  return { x: Math.random(), y: Math.random(),
    r: rnd(rLo, rHi), o: rnd(oLo, oHi), vy: rnd(vLo, vHi),
    ph: rnd(0, 6.28), sw: rnd(0.1, 0.35), dr: rnd(-1, 1) * 0.00006,
    tw: rnd(0.15, 0.6) };                            // 闪烁极缓
}
function seedSnow(){
  cv.width = innerWidth; cv.height = innerHeight;
  const S = MOBILE ? CFG.dustScaleMobile : 1;
  dust    = Array.from({length: Math.round(CFG.dustN * S)}, () => mkP(0.4, 1.2, 0.10, 0.40, 2.0, 6));
  sparkle = Array.from({length: Math.round(CFG.sparkleN * S)}, () => mkP(1.3, 2.4, 0.45, 0.95, 1.2, 3.5));
}
seedSnow();
let scrollPx = 0;
addEventListener("scroll", () => { scrollPx = window.scrollY || 0; }, { passive: true });
function step(list, dt, H){
  for (const p of list) {
    p.y -= p.vy * dt / H; p.x += p.dr * dt;
    if (p.y < -0.06) { p.y = 1.06; p.x = Math.random(); }
    if (p.x < -0.05) p.x = 1.05; else if (p.x > 1.05) p.x = -0.05;
  }
}
function drawLayer(c, list, s, W, H, par, twinkle){
  for (const p of list) {
    const px = p.x * W + Math.sin(s * p.sw + p.ph) * 3;
    let py = p.y * H - scrollPx * par;
    py = ((py % (H + 90)) + H + 90) % (H + 90) - 45;      // 滚动视差：环绕回卷
    let a = p.o;
    if (twinkle) a *= 0.72 + 0.28 * Math.sin(s * p.tw + p.ph);   // 缓慢明暗呼吸
    c.beginPath(); c.arc(px, py, p.r, 0, 6.283);
    c.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`; c.fill();
  }
}
function drawSnow(dt, s){
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  step(dust, dt, H); step(sparkle, dt, H);
  drawLayer(ctx, sparkle, s, W, H, 0.12, true);           // 亮点层：白、略大、缓闪
  drawLayer(ctx, dust,    s, W, H, 0.05, false);          // 细尘层：白、针尖、恒定
}
/* SECTION: animation loop */
let last = 0, raf = null;
let _frame = 0;
function tick(ts){ const dt = Math.min(.05, (ts - last) / 1000) || 0.016; last = ts;
  const s = ts / 1000;
  advance(s, dt);
  for (const t of tiles) {
    const r = t.rot + Math.sin(s * t.rw + t.rph) * CFG.rotAmp;
    t.el.style.transform = `translate3d(${t.px.toFixed(1)}px,${t.py.toFixed(1)}px,0) rotate(${r.toFixed(2)}deg)`; }
  drawSnow(dt, s);
  if (_hooks["frame"]) emit("frame", { t: s, frame: ++_frame });
  raf = requestAnimationFrame(tick); }
if (reduced) { for (const t of tiles)
    t.el.style.transform = `translate3d(${t.cx}px,${t.cy}px,0) rotate(${t.rot}deg)`;
} else { raf = requestAnimationFrame(t => { last = t; tick(t); }); }
let rzT = null;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); advance(0); seedSnow(); }, 150); });
/* SECTION: lightbox — 点击加载完整原图 */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img");
let lbRecord = null;
function openLB(d){
  lbRecord = tileById(d.id) || null;
  /* 钩子：外部可拦截（如改为显示元数据面板），返回 false 则不开默认灯箱 */
  if (emit("lightbox:before", { id: d.id, record: lbRecord, data: d }) === false) return;
  lbImg.alt = d.id;
  lbImg.src = d.src;
  if (d.full) { lb.classList.add("open", "loading");
    const hi = new Image();
    hi.onload = () => { lbImg.src = d.full; lb.classList.remove("loading"); };
    hi.onerror = () => lb.classList.remove("loading");
    hi.src = d.full; }
  else lb.classList.add("open");
  emit("lightbox:open", { id: d.id, record: lbRecord, el: lb }); }
function closeLB(){ lb.classList.remove("open", "loading"); lbRecord = null; emit("lightbox:close", {}); }
lb.addEventListener("click", closeLB);
addEventListener("keydown", e => { if (e.key === "Escape") closeLB(); });

/* SECTION: hooks & API — 未来功能挂载点；核心引擎不认识任何业务语义 */
const _hooks = {};
function on(name, fn){ (_hooks[name] = _hooks[name] || []).push(fn); return () => off(name, fn); }
function off(name, fn){ const a = _hooks[name]; if (a) { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); } }
function emit(name, payload){
  const a = _hooks[name]; let r;
  if (a) for (const fn of a) { try { const v = fn(payload); if (v === false) r = false; } catch (e) { console.warn("[playground] hook", name, e); } }
  return r;
}
function tileById(id){ for (const t of tiles) if (t.id === id) return t; return null; }
/* relayout(kind, keyFn)：外部提供排序键即可重组（如按谱系聚拢）；重排后重算碰撞预算 */
function relayout(kind, keyFn){
  emit("relayout:before", { kind });
  _sortKey = (kind && keyFn) ? keyFn : null;
  layout(); advance(_last || 0, 0.016);
  emit("relayout:after", { kind });
}
/* setTargets(map|fn)：设定重组目标锚点，配合 CFG.morph>0 平滑过渡 */
function setTargets(spec){
  for (const t of tiles) {
    if (typeof spec === "function") { const p = spec(t); if (p) { t.tx = p.x; t.ty = p.y; } }
    else if (spec && spec[t.id]) { t.tx = spec[t.id].x; t.ty = spec[t.id].y; }
  }
  if (CFG.morph <= 0) { layout(); advance(_last || 0, 0.016); }   /* morph=0：直接落位 */
}
const Playground = {
  on, off, emit, tileById, relayout, setTargets, openLB, closeLB,
  get tiles(){ return tiles; },
  get records(){ return DATA; },
  get config(){ return CFG; },
  get canvasHeight(){ return parseFloat(FIELD.style.height) || 0; },
  layout(){ layout(); advance(_last || 0, 0.016); },
  setConfig(patch){ Object.assign(CFG, patch); layout(); advance(_last || 0, 0.016); },
  version: "__VERSION__"
};
window.Playground = Playground;
emit("ready", { api: Playground, count: tiles.length });
</script>
