<style>
/* SECTION: base */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{background:#000;overflow-x:hidden;overscroll-behavior:none}
#snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1;opacity:.5}
#field{position:relative;z-index:2}
/* SECTION: tiles */
.tile{position:absolute;left:0;top:0;will-change:transform;cursor:pointer}
.tile .body{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;
  transition:transform .4s cubic-bezier(.2,.9,.25,1), filter .4s ease}
.tile img{display:block;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.1s ease}
.tile img.on{opacity:1}
.tile .body.dead{background:radial-gradient(circle at 50% 50%, #0a141c 0%, transparent 72%)}
.tile:hover{z-index:9}
.tile:hover .body{transform:scale(1.15);filter:brightness(1.12) saturate(1.08)}
/* SECTION: lightbox */
#lb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:opacity .35s ease}
#lb.open{opacity:1;pointer-events:auto}
#lb .frame{max-width:min(94vw,1200px);max-height:92vh;text-align:center}
#lb img{max-width:100%;max-height:88vh;width:auto;border-radius:8px;
  box-shadow:0 30px 90px rgba(0,0,0,.9)}
#lb .spin{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px;
  border:2px solid rgba(130,210,255,.25);border-top-color:#8fd8ff;border-radius:50%;
  opacity:0;transition:opacity .2s}
#lb.loading .spin{opacity:1}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="field" aria-hidden="true"></div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="spin"></div>
  <div class="frame"><img id="lb-img" alt=""></div>
</div>
<script>
"use strict";
/* SECTION: drift field engine */
const DATA = window.BW_DATA || [];
const FIELD = document.getElementById("field");
const MOBILE = innerWidth < 720;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* 色彩交错：按颜色轮转，避免同色聚集 */
const byColor = {};
DATA.forEach(d => (byColor[d.c] = byColor[d.c] || []).push(d));
const cols0 = Object.keys(byColor).sort((a,b)=>byColor[b].length-byColor[a].length);
const ordered = [];
{ let added = true, i = 0;
  while (added) { added = false;
    for (const c of cols0) { const arr = byColor[c];
      if (arr[i]) { ordered.push(arr[i]); added = true; } }
    i++; } }
const rnd = (a,b)=>a+Math.random()*(b-a);
const tiles = ordered.map(d=>{
  const el = document.createElement("figure");
  el.className = "tile";
  el.innerHTML = `<div class="body"><img data-image="${d.u}" alt="${d.t} specimen ${d.y}"
    loading="lazy" decoding="async"></div>`;
  const img = el.querySelector("img");
  img.src = img.dataset.image;                          // 运行时赋值
  img.onload = () => img.classList.add("on");
  img.onerror = () => { img.remove(); el.querySelector(".body").classList.add("dead"); };
  el.addEventListener("click", () => openLB(d));
  FIELD.appendChild(el);
  return { el, d,
    fs: rnd(0.58, 0.72),                                // 尺寸 = 格子 × fs
    jx: rnd(-0.05, 0.05), jy: rnd(-0.05, 0.05),         // 锚点抖动
    ax: MOBILE ? rnd(4, 8) : rnd(8, 16),                // 漂移半径 px（含抖动仍不越格）
    ay: MOBILE ? rnd(5, 9) : rnd(10, 16),
    wx: rnd(0.06, 0.16), wy: rnd(0.08, 0.18),
    phx: rnd(0, 6.28), phy: rnd(0, 6.28), rot: rnd(-3, 3),
    size: 0, bx: 0, by: 0 };
});
/* SECTION: long-scroll layout — 均匀铺满整条长卷 */
function layout(){
  const W = innerWidth;
  const cols = MOBILE ? 2 : W < 1100 ? 3 : 4;
  const rows = Math.ceil(tiles.length / cols);
  const cw = W / cols, ch = MOBILE ? cw : Math.round(cw * 0.95);
  FIELD.style.height = rows * ch + "px";
  tiles.forEach((t, i) => {
    const c = i % cols, r = (i / cols) | 0;
    const cell = Math.min(cw, ch);
    t.size = Math.round(cell * t.fs);
    t.el.style.width = t.el.style.height = t.size + "px";
    t.bx = (c + 0.5) * cw + t.jx * cw;
    t.by = (r + 0.5) * ch + t.jy * ch;
  });
}
layout();
/* SECTION: marine snow（固定背景层，随滚动常驻） */
const cv = document.getElementById("snow"), ctx = cv.getContext("2d");
let flakes = [];
function seedSnow(){ cv.width = innerWidth; cv.height = innerHeight;
  const N = MOBILE ? 120 : 300;
  flakes = Array.from({length: N}, () => ({x: rnd(0, cv.width), y: rnd(0, cv.height),
    r: rnd(.4, 1.9), vy: rnd(3, 13), vx: rnd(-3, 3), o: rnd(.05, .4)})); }
seedSnow();
function drawSnow(dt){ ctx.clearRect(0, 0, cv.width, cv.height);
  for (const f of flakes) { f.y -= f.vy * dt; f.x += Math.sin(f.y * 0.004) * 0.15 + f.vx * dt * 0.1;
    if (f.y < -4) { f.y = cv.height + 4; f.x = rnd(0, cv.width); }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283);
    ctx.fillStyle = `rgba(190,225,255,${f.o})`; ctx.fill(); } }
/* SECTION: float loop — 锚点周游漂移，永不飞散 */
let last = 0;
function tick(ts){ const dt = Math.min(.05, (ts - last) / 1000) || 0.016; last = ts;
  const s = ts / 1000;
  for (const t of tiles) {
    const x = t.bx + Math.sin(s * t.wx + t.phx) * t.ax;
    const y = t.by + Math.sin(s * t.wy + t.phy) * t.ay;
    t.el.style.transform = `translate3d(${(x - t.size / 2).toFixed(1)}px,${(y - t.size / 2).toFixed(1)}px,0) rotate(${t.rot.toFixed(2)}deg)`; }
  drawSnow(dt);
  raf = requestAnimationFrame(tick); }
let raf = null;
if (reduced) { for (const t of tiles)
    t.el.style.transform = `translate3d(${t.bx - t.size / 2}px,${t.by - t.size / 2}px,0)`;
} else { raf = requestAnimationFrame(t => { last = t; tick(t); }); }
let rzT = null;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); seedSnow(); }, 120); });
/* SECTION: lightbox — 点击加载完整原图，缩略图即时垫底 */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img");
function openLB(d){
  lbImg.alt = `${d.t} specimen ${d.y}`;
  lbImg.src = d.u;                                      // 秒开占位
  if (d.fu) { lb.classList.add("open", "loading");
    const hi = new Image();
    hi.onload = () => { lbImg.src = d.fu; lb.classList.remove("loading"); };
    hi.onerror = () => lb.classList.remove("loading");
    hi.src = d.fu;                                      // 原图渐进替换
  } else lb.classList.add("open"); }
lb.addEventListener("click", () => { lb.classList.remove("open", "loading"); });
addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open", "loading"); });
</script>
