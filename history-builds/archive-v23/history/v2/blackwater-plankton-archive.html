<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homoplankton — Blackwater Archive</title>
<script src="assets/data.js"></script>
<style>
/* SECTION: base */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#000;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
#field{position:absolute;inset:0;overflow:hidden}
/* SECTION: tiles */
.tile{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;z-index:2}
.tile .body{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;
  transition:transform .4s cubic-bezier(.2,.9,.25,1), filter .4s ease}
.tile img{display:block;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.1s ease}
.tile img.on{opacity:1}
.tile .body.dead{background:radial-gradient(circle at 50% 50%, #0a141c 0%, transparent 72%)}
.tile:hover{z-index:9}
.tile:hover .body{transform:scale(1.15);filter:brightness(1.12) saturate(1.08)}
/* SECTION: lightbox */
#lb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.88);opacity:0;pointer-events:none;transition:opacity .35s ease}
#lb.open{opacity:1;pointer-events:auto}
#lb .frame{max-width:min(88vw,760px);text-align:center}
#lb img{width:100%;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.9)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="snow"></canvas>
  <div id="field" aria-hidden="true"></div>
</div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="frame"><img id="lb-img" alt=""></div>
</div>
<script>
"use strict";
/* SECTION: drift field engine */
const DATA = window.BW_DATA || [];
const FIELD = document.getElementById("field");
const MOBILE = innerWidth < 720;
const COUNT = MOBILE ? Math.min(64, DATA.length) : DATA.length;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* 色彩交错：按颜色轮转选取，避免同色聚集 */
const byColor = {};
DATA.forEach(d => (byColor[d.c] = byColor[d.c] || []).push(d));
const cols0 = Object.keys(byColor).sort((a,b)=>byColor[b].length-byColor[a].length);
const interleaved = [];
{ let added = true, i = 0;
  while (added) { added = false;
    for (const c of cols0) { const arr = byColor[c];
      if (arr[i]) { interleaved.push(arr[i]); added = true; } }
    i++; } }
const chosen = interleaved.slice(0, COUNT);
const rnd = (a,b)=>a+Math.random()*(b-a);
/* 每个 tile 的固有随机参数（尺寸系数、格内抖动、速度、摆动） */
const tiles = chosen.map(d=>{
  const el = document.createElement("figure");
  el.className = "tile";
  el.innerHTML = `<div class="body"><img data-image="${d.u}" alt="${d.t} specimen ${d.y}"
    loading="eager" decoding="async"></div>`;
  const img = el.querySelector("img");
  img.src = img.dataset.image;                          // 运行时赋值
  img.onload = () => img.classList.add("on");
  img.onerror = () => { img.remove(); el.querySelector(".body").classList.add("dead"); };
  el.addEventListener("click", () => openLB(d));
  FIELD.appendChild(el);
  return { el, d,
    fs: rnd(0.5, 0.66),                                 // 尺寸 = 格子 × fs，保证不重叠
    jx: rnd(-0.06, 0.06), jy: rnd(-0.06, 0.06),         // 格内抖动
    vy: rnd(2.2, 6.5) * (MOBILE ? 0.7 : 1),             // 上浮 px/s
    amp: rnd(3, 9), w: rnd(0.05, 0.18), ph: rnd(0, 6.28), rot: rnd(-3, 3),
    size: 0, bx: 0, y: 0, par: 0 };
});
/* SECTION: grid layout — 均匀铺满全屏，窗口变化自动重排 */
function relayout(){
  const W = innerWidth, H = innerHeight;
  const n = tiles.length;
  const cols = Math.max(4, Math.round(Math.sqrt(n * W / H)));
  const rows = Math.ceil(n / cols);
  const cw = W / cols, ch = H / rows, cell = Math.min(cw, ch);
  tiles.forEach((t, i) => {
    const c = i % cols, r = (i / cols) | 0;
    t.size = Math.round(cell * t.fs);
    t.el.style.width = t.el.style.height = t.size + "px";
    t.bx = (c + 0.5) * cw + t.jx * cw;                  // 列中心 + 横向抖动
    t.y = (r + 0.5) * ch + t.jy * ch;                   // 行中心 + 纵向抖动，重排即复位
    t.par = 0.3 + 0.7 * (t.size / cell);                // 大=近层，视差强
  });
}
relayout();
let mx = 0, my = 0, tmx = 0, tmy = 0;
addEventListener("pointermove", e => { tmx = e.clientX / innerWidth - .5; tmy = e.clientY / innerHeight - .5; });
/* SECTION: marine snow */
const cv = document.getElementById("snow"), ctx = cv.getContext("2d");
let flakes = [];
function seedSnow(){ cv.width = innerWidth; cv.height = innerHeight;
  const N = MOBILE ? 120 : 300;
  flakes = Array.from({length: N}, () => ({x: rnd(0, cv.width), y: rnd(0, cv.height),
    r: rnd(.4, 1.9), vy: rnd(3, 13), vx: rnd(-3, 3), o: rnd(.05, .4)})); }
seedSnow();
function drawSnow(dt){ ctx.clearRect(0, 0, cv.width, cv.height);
  for (const f of flakes) { f.y -= f.vy * dt; f.x += Math.sin(f.y * 0.004) * 0.15 + f.vx * dt * 0.1;
    if (f.y < -4) { f.y = cv.height + 4; f.x = rnd(0, cv.width); }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283);
    ctx.fillStyle = `rgba(190,225,255,${f.o})`; ctx.fill(); } }
/* SECTION: animation loop */
let last = 0, raf = null;
function tick(ts){ const dt = Math.min(.05, (ts - last) / 1000) || 0.016; last = ts;
  mx += (tmx - mx) * 0.04; my += (tmy - my) * 0.04;
  const H = innerHeight;
  for (const t of tiles) { t.y -= t.vy * dt;
    if (t.y < -t.size - 10) t.y = H + t.size + rnd(0, 40);   // 出顶后回到本列底部
    const wx = Math.sin(ts / 1000 * t.w + t.ph) * t.amp;     // 轻微左右摇曳
    const px = t.bx + wx - mx * 8 * t.par;                   // 视差收紧，防重叠
    const py = t.y - my * 6 * t.par;
    t.el.style.transform = `translate3d(${(px - t.size / 2).toFixed(1)}px,${(py - t.size / 2).toFixed(1)}px,0) rotate(${t.rot.toFixed(2)}deg)`; }
  drawSnow(dt);
  raf = requestAnimationFrame(tick); }
if (reduced) { for (const t of tiles)
    t.el.style.transform = `translate3d(${t.bx - t.size / 2}px,${t.y - t.size / 2}px,0)`;
} else { raf = requestAnimationFrame(t => { last = t; tick(t); }); }
let rzT = null;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(relayout, 120); seedSnow(); });
/* SECTION: lightbox */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img");
function openLB(d){ lbImg.alt = `${d.t} specimen ${d.y}`; lbImg.src = d.u; lb.classList.add("open"); }
lb.addEventListener("click", () => lb.classList.remove("open"));
addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open"); });
</script>
</body>
</html>
