<style>
/* SECTION: base */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{background:#000;overflow-x:hidden;overscroll-behavior:none}
#snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
#field{position:relative;z-index:2}
/* 无整层幕布：星尘即刻可见，图块各自淡入。
   旧机制（opacity:0 → .revealed 掀幕）在首屏图未及时到达时只能靠盲超时揭幕，
   观感是「先纯黑很久，然后图片一张张蹦」。保留 .revealed 规则以兼容外部钩子调用。 */
#field.revealed{opacity:1}
/* SECTION: tiles — 深羽化 + 黑点提升：图像暗部直接落入页面纯黑，矩形边完全消隐 */
.tile{position:absolute;left:0;top:0;will-change:transform;cursor:pointer}
.tile .body{position:relative;width:100%;height:100%;overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.9,.25,1);
  -webkit-mask-image:radial-gradient(115% 115% at 50% 50%, #000 55%, rgba(0,0,0,.45) 80%, transparent 97%);
  mask-image:radial-gradient(115% 115% at 50% 50%, #000 55%, rgba(0,0,0,.45) 80%, transparent 97%)}
.tile img{display:block;width:100%;height:100%;object-fit:fill;  /* 原始比例，无裁切 */
  filter:brightness(.92) contrast(1.06);
  opacity:0;transition:opacity .7s ease,filter .5s ease}
.tile img.in{opacity:1}                                   /* 各自到齐后独立淡入 */
.tile:hover{z-index:60}
.tile:hover .body{transform:scale(1.1)}
.tile:hover img{filter:brightness(1) contrast(1.02)}
/* SECTION: lightbox */
#lb{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.92);opacity:0;pointer-events:none;transition:opacity .4s ease}
#lb.open{opacity:1;pointer-events:auto}
#lb .frame{max-width:min(96vw,1400px);text-align:center}
#lb img{max-width:100%;max-height:92vh;width:auto;border-radius:6px;
  box-shadow:0 30px 90px rgba(0,0,0,.9)}
#lb .spin{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px;
  border:2px solid rgba(130,210,255,.25);border-top-color:#8fd8ff;border-radius:50%;
  opacity:0;transition:opacity .2s}
#lb.loading .spin{opacity:1}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="field" aria-hidden="true"></div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="spin"></div>
  <div class="frame"><img id="lb-img" alt=""></div>
</div>
<script>
"use strict";
/* SECTION: independent drift — 每张图自己的李萨如航迹：
   1) 紧密随机放置（只预留呼吸 gap，无轨道预留 → 不稀疏）
   2) 放置后量出每图四方向实际空档，轨道半径 = 空档对半分（几何上
      双方相向漂到极限也只是相切 → 任何帧零重叠，无需共享平移）
   3) 空档大的漂得远，挤的地方微动——振幅天然参差，航向各自独立 */
const DATA = (window.PLAYGROUND_DATA && window.PLAYGROUND_DATA.records) || window.BW_DATA || [];
const FIELD = document.getElementById("field");
const MOBILE = innerWidth < 720;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a,b)=>a+Math.random()*(b-a);
/* CONFIG — v23 基线默认值；覆盖优先级：data.config > 此处默认 */
const CFG = Object.assign({
  E: MOBILE ? 4 : 6,              /* 上下边缘安全距 */
  MX: MOBILE ? 24 : 70,           /* 左右禁飞区：图块与漂移轨道永不进入 */
  RCAP: MOBILE ? 26 : 46,         /* 轨道半径上限 */
  RES: MOBILE ? 10 : 15,          /* 每侧最小跑道 */
  loF: MOBILE ? 0.228 : 0.113,    /* 尺寸带下限（视口宽占比） */
  hiF: MOBILE ? 0.26 : 0.143,     /* 尺寸带上限 */
  heightCap: MOBILE ? 0.42 : 0.42,/* 竖图高度帽（视口高占比） */
  voidRatio: 1.5,                 /* 画布空隙率（越小越密） */
  bandsPerScreen: 3,              /* 纵向带数 = 屏数 × 此值 */
  clusterBias: 0.6,               /* 聚簇偏置概率 */
  gapMin: 6, gapSpan: 8,          /* 呼吸间距 = gapMin + hash*gapSpan */
  /* —— 相对倍率：缩放「平台默认值」而非写死绝对值 ——
     绝对覆盖（如 RES:6）在两端收紧比例不同（桌面 15→6 是 -60%，手机 10→6 只有 -40%），
     导致同一份 config 在桌面/手机上密度增益不一致（实测 +23.5% vs +17.0%）。
     倍率对平台默认值生效，故两端比例一致，且默认 1 时与 v23 逐帧等价。 */
  spacingFactor: 1,               /* 间距倍率：<1 更密。同时缩放 RES 与 gap */
  speedFactor: 1,                 /* 速度倍率：>1 更快。只缩放角频率，不动振幅 */
  wxLo: 0.05, wxHi: 0.22,         /* 漂移角频率范围 */
  wyLo: 0.04, wyHi: 0.2,
  rotSpan: 6, rotAmp: 2.8,        /* 静态摆角与摆动幅度 */
  rwLo: 0.03, rwHi: 0.09,
  dustN: 460, sparkleN: 46,       /* 星尘数量（桌面基准） */
  dustScaleMobile: 0.45,
  revealTimeout: 5000,            /* 兜底：仅防首屏图全部失败时卡死揭幕钩子 */
  /* —— 分级加载：只影响「何时开始下载」，不影响布局坐标与运动，故 v23 几何等价性不变 —— */
  loadConcurrency: MOBILE ? 4 : 6,/* 并发上限，对齐浏览器同域连接数，避免长队互堵 */
  lazyMargin: 1.0,                /* 懒加载提前量（视口高倍数），滚动前提前取下方图 */
  morph: 0,                       /* 0=与 v23 逐帧一致；>0=向目标锚点插值（重组用） */
  /* —— 缺陷修复开关：默认 false 以保持与 v23 逐帧等价（v23 本身即带这两个缺陷）——
     二者都会改变布局几何，故必须显式开启；开启后等价性校验会失败，这是预期而非回归。 */
  fixScreensCap: false,           /* true=画布屏数上限随张数伸缩（修「上限绑定→底部堆图」） */
  fixFallbackScan: false,         /* true=兜底/自愈扫描步长细化（修「明明有位却垫到画布底部」） */
  fixOrbitRadius: false,          /* true=轨道半径用满预算 (L+R)/2（修「图块视觉静止/锁住不动」） */
  fixWeakMovers: false,           /* true=弱动救济：把被四面包夹的图块搬到净余量更大处再重算预算 */
  /* 逐图块速度下限：可感知性是「速度 = 频率 × 半径」，不是半径。
     零相交只取决于半径，与频率无关，故提频不放松任何安全保证 —— 这是唯一能
     在「很密」与「看得出在动」之间兼得的手段（搬迁/加宽间隙都会牺牲密度）。 */
  weakRatio: 0,                   /* >0 时启用：速度下限 = 本页峰值速度中位数 × 此比例。
                                     实测 0.72 → 桌面下限约 4.3px/s（最弱块 1.11→4.32），手机约 2.7px/s */
  speedFloorCap: 6,               /* 提频倍率上限，避免小半径图块被推到抖动感 */
  weakPercept: 0.0085,            /* 可感知阈值 = 视口宽 × 此值（桌面 1440 → 约 12px 主导轴振幅） */
  weakMaxPerRound: 30,            /* 每轮最多搬迁张数（按最弱者优先） */
  weakRounds: 2,                  /* 救济轮数：搬动可能使别处变弱，故迭代 */
  /* —— 实验：每次刷新重新随机尺寸 ——
     v2 默认关闭：hash 由图块序号决定，故同一张图的尺寸在任何刷新里恒定，
     只有位置随 Math.random() 变化（正是用户实测观察到的现象）。 */
  randomSize: 0,                  /* 1=每次加载重抽 hash，使每张图尺寸随刷新变化 */
  sizeSpread: 1,                  /* 尺寸带展宽倍率（围绕带中心向外展开）。原带 162–206px
                                     比值仅 1.27，尺寸变化太微弱、肉眼难辨；>1 才看得出「这张变大了」。
                                     代价见 params.md 制约②：带宽越大参差感越强，但大图更占跑道、
                                     会反向压缩可放置间隙 → 可能抬升弱动/兜底张数。 */
  /* 强制跳变（新机制）：页面记住每张图上次的宽度，本次只在「与上次相差 ≥ 此比例」的
     子区间内均匀抽取。这样"每次刷新都看得出尺寸变化"由机制保证，不依赖概率碰运气；
     尺寸仍严格落在 sizeSpread 决定的范围内，位置照旧每次随机。0=关闭（普通随机）。 */
  sizeJumpMin: 0,                 /* 建议 0.15–0.25：太小变化难察觉，太大易在两端来回弹 */
  morphSpeed: 0.9                 /* 插值收敛速度（1/秒） */
}, (window.PLAYGROUND_DATA && window.PLAYGROUND_DATA.config) || {});
const E = CFG.E, MX = CFG.MX, RCAP = CFG.RCAP;
function screenScale(d){
  if(!d.box) return 0.62;
  const f = Math.max(d.box[2]-d.box[0], (d.box[3]-d.box[1])*0.75);
  return Math.min(1.15, Math.max(0.55, 0.6 / Math.max(f, 0.18)));
}
/* 字段兼容：新版 src/full，旧版 u/fu */
for (const d of DATA) { if (!d.src && d.u) d.src = d.u; if (!d.full && d.fu) d.full = d.fu; }
/* —— 尺寸记忆：让「每次刷新尺寸都看得出变化」由机制保证，而非靠概率 ——
   读取上次的宽度表；无 localStorage（隐私模式）或首次访问时退化为普通随机，不影响其余功能。
   __ppSizeMemSeed 供无头仿真工具接力注入上次结果，以便验证跳变保证。 */
let _sizeMem = {}, _sizeMemNext = {}, _sizeMemApplied = false;
(function readSizeMem(){
  if (!CFG.randomSize || !(CFG.sizeJumpMin > 0)) return;
  try {
    if (typeof window !== "undefined" && window.__ppSizeMemSeed) { _sizeMem = window.__ppSizeMemSeed; return; }
    const raw = (typeof localStorage !== "undefined") ? localStorage.getItem("pp.sizeMem.v1") : null;
    if (raw) { const o = JSON.parse(raw); if (o && typeof o === "object") _sizeMem = o; }
  } catch (e) { _sizeMem = {}; }
})();
const tiles = DATA.map((d,i)=>{
  const el = document.createElement("figure");
  el.className = "tile";
  el.dataset.id = d.id;
  el.innerHTML = `<div class="body"><img data-image="${d.src}" alt="${d.id}"></div>`;
  const img = el.querySelector("img");
  img.addEventListener("load", () => { img.classList.add("in"); settleIn(d.id); });
  img.addEventListener("error", () => { img.remove(); el.querySelector(".body").classList.add("dead"); settleIn(d.id); });
  /* 不在此处赋 src：加载时机由 layout() 后的编排器决定（首屏优先 + 滚动懒加载）。
     历史教训：曾在此「全部立即加载」，N 张 MB 级原图一次性占满浏览器 6 条连接，
     首屏图迟迟不到 → revealTimeout 盲兜底掀开幕布 → 用户看到纯黑背景后图片一张张蹦出。 */
  el.addEventListener("click", () => openLB(d));
  FIELD.appendChild(el);
  /* hash 同时决定尺寸带内位置与呼吸间距。v2 用 sin(i*12.9898) —— 序号的纯函数，
     故同一张图在任何刷新里尺寸恒定，只有位置随 Math.random() 变（用户实测发现的现象）。
     randomSize=1 时改为真随机抽取，使每次刷新尺寸也重排。 */
  const hash = CFG.randomSize ? Math.random() : Math.abs(Math.sin(i * 12.9898) % 1);
  return { el, d, i, hash, id: d.id,
    attrs: d.attrs || {},                                 /* 任意业务数据，引擎只透传不解释 */
    rx: 0, ry: 0, ox: 0, oy: 0,
    /* 只缩放角频率范围（=速度），不碰振幅 rx/ry；缩放范围不改变取随机数的次数，
       故 speedFactor=1 时随机序列与 v23 完全一致。 */
    wx: rnd(CFG.wxLo * CFG.speedFactor, CFG.wxHi * CFG.speedFactor),
    wy: rnd(CFG.wyLo * CFG.speedFactor, CFG.wyHi * CFG.speedFactor),
    phx: rnd(0, 6.28), phy: rnd(0, 6.28),
    rot: rnd(-CFG.rotSpan, CFG.rotSpan), rw: rnd(CFG.rwLo, CFG.rwHi), rph: rnd(0, 6.28),
    w: 0, h: 0, cx: 0, cy: 0, tx: null, ty: null,          /* tx/ty = 重组目标锚点 */
    px: 0, py: 0 };
});
/* SECTION: layout */
let _sortKey = null;                    /* 外部注入的重组排序键 */
let FALLBACK_N = 0;                     /* 延底垫放计数：验证脚本据此断言「兜底放置 = 0」 */
function layout(){
  const W = innerWidth, VH = innerHeight;
  /* 1. 定尺寸：桌面 162–206px 带内随机（下限+20%，上限不变），手机 89–101px
     sizeSpread=1 → 与 v2 完全一致（含钳位边界）；>1 → 围绕带中心对称展宽。
     钳位必须用展宽后的 loF/hiF，否则展宽被原边界吃回去、等于没生效。 */
  const _C = (CFG.loF + CFG.hiF) / 2, _H = (CFG.hiF - CFG.loF) / 2;
  const loF = Math.max(0.045, _C - _H * CFG.sizeSpread);
  const hiF = _C + _H * CFG.sizeSpread;
  for (const t of tiles) {
    const ratio = (t.d.h || 3) / (t.d.w || 4);
    if (!CFG.randomSize) {
      /* v2 原路径逐字保留：先乘比例因子生成、再钳位（含 hCap 反推）。
         注意这条路径存在钳位堆积（一段 hash 坍缩到同一像素值），v2 尺寸恒定故无感知问题。 */
      let w = Math.round(W * (loF + (hiF - loF) * t.hash) * (0.82 + 0.36 * (screenScale(t.d) - 0.55)));
      w = Math.min(Math.max(w, Math.round(W * loF)), Math.round(W * hiF));
      let h = Math.round(w * ratio);
      const hCap = Math.round(VH * CFG.heightCap);
      if (h > hCap) { h = hCap; w = Math.max(1, Math.round(h / ratio)); }
      t.w = w; t.h = h;
    } else {
      /* 无尖峰映射（randomSize 专用）：
         旧写法「生成→钳位」会把一整段 hash 坍缩到边界像素值（实测 _Y3A0081 有 30% 的加载
         恰好=128px、DSC_1297 有 ~20% 恰好=240px），用户看到的就是「两档来回切换」。
         正解：先算出该图的**无钳位可用区间** = [缩放后带 ∩ 全局带 ∩ 高度帽上限]，
         再让 hash 在区间内做连续线性映射。区间端点只在 hash=0/1 单点命中，
         测度为零，故不存在堆积尖峰；每图区间随比例因子/纵横比不同而不同，保留参差。 */
      const mult = 0.82 + 0.36 * (screenScale(t.d) - 0.55);
      const gLo = W * loF, gHi = W * hiF;
      const hCapW = (Math.round(VH * CFG.heightCap)) / ratio;   // 高度帽折算成宽度上限
      let bLo = Math.max(gLo * mult, gLo);
      let bHi = Math.min(gHi * mult, gHi, hCapW);
      if (bHi < bLo) bHi = bLo;                                 // 极端竖图的退化情形
      /* 强制跳变：若记住了上次宽度 prev，则只在「距 prev ≥ sizeJumpMin×prev」的子区间内抽取。
         可行域是 [bLo, prev*(1-j)] ∪ [prev*(1+j), bHi] 两段；随机选一段非空的、再在其中均匀取值。
         两段都空（区间太窄）才退化为普通随机 —— 此时至少保证仍落在范围内。
         这样"每次刷新都看得出变化"由机制保证，不靠概率碰运气。 */
      let w;
      const prev = _sizeMem[t.d.id];
      const j = CFG.sizeJumpMin;
      if (prev > 0 && j > 0) {
        const loA = bLo, hiA = prev * (1 - j);
        const loB = prev * (1 + j), hiB = bHi;
        const okA = hiA - loA > 1, okB = hiB - loB > 1;
        if (okA && okB) w = Math.random() < 0.5 ? rnd(loA, hiA) : rnd(loB, hiB);
        else if (okA) w = rnd(loA, hiA);
        else if (okB) w = rnd(loB, hiB);
        else w = rnd(bLo, bHi);                                 // 区间太窄：退化为普通随机
      } else {
        w = rnd(bLo, bHi);
      }
      w = Math.round(w);
      const h = Math.round(w * ratio);                          // 由 bHi≤hCapW 保证 h≤hCap
      t.w = w; t.h = h;
      _sizeMemNext[t.d.id] = w;
    }
    t.gap = Math.round((CFG.gapMin + t.hash * CFG.gapSpan) * CFG.spacingFactor);   // 呼吸间距 × 间距倍率
    t.el.style.width = t.w + "px"; t.el.style.height = t.h + "px";
  }
  /* 把本次宽度写回记忆，供下次刷新做强制跳变。整个 try 包裹：
     写失败（隐私模式/配额满）只影响下次的跳变保证，不影响本次渲染。 */
  if (CFG.randomSize && CFG.sizeJumpMin > 0 && !_sizeMemApplied) {
    _sizeMemApplied = true;
    try {
      if (typeof window !== "undefined") window.__ppSizeMem = _sizeMemNext;
      if (typeof localStorage !== "undefined") localStorage.setItem("pp.sizeMem.v1", JSON.stringify(_sizeMemNext));
    } catch (e) { /* 忽略：记忆失败不致命 */ }
  }
  /* 2. 画布高度：占位面积 × 空隙率；固定 H0 作带基准，杜绝扩容下移 */
  const RES = Math.round(CFG.RES * CFG.spacingFactor);   // 每侧最小跑道 × 间距倍率（本函数内全部 RES 用途一致）
  let area = 0;
  for (const t of tiles) area += (t.w + t.gap + 2 * (E + RES)) * (t.h + t.gap + 2 * (E + RES));
  /* 屏数上限必须随张数伸缩：上限一旦绑定，放置就找不到空位 →
     走「延底垫放」把图块堆到画布左下角；这也让 voidRatio 调密度失效（画布缩不动，只是堆得更多）。
     与 verify_layout.mjs 的 screensCap 同一公式，保持引擎与断言口径一致。
     默认 8 屏 —— 这是 baseline-v23.html 的真实取值。模板曾误写成 9：
     1440x900 下上限从不绑定，故等价性校验一直通过、无人察觉；
     但手机/窄屏视口上限会绑定，导致已交付的 v1 在两端与真 v23 分歧
     （实测 H0 8290 vs 8208，随后垫放把差异放大到数千像素）。
     由 fixScreensCap 开关控制是否随张数伸缩。 */
  const screensCap = CFG.fixScreensCap ? Math.max(8, Math.ceil(tiles.length * 0.25)) : 8;
  let H0 = Math.max(VH * 2.2, Math.min(VH * screensCap, area * CFG.voidRatio / W));
  const fits = (x, y, t) => {
    if (x < MX || y < E + RES || x + t.w > W - MX || y + t.h > H0 - E - RES) return false;
    for (const p of tiles) {
      if (p === t || !p.placed) continue;
      const bx = (t.gap + p.gap) / 2 + 2 * RES, by = bx;
      if (x - bx < p.cx + p.w && p.cx - bx < x + t.w &&
          y - by < p.cy + p.h && p.cy - by < y + t.h) return false;
    }
    return true;
  };
  /* 3. 放置顺序：默认大 → 小；注入 _sortKey 时可按业务键重组（同键连续 → 同带聚拢） */
  const order = tiles.slice().sort((a, b) => {
    if (_sortKey) {
      const ka = String(_sortKey(a)), kb = String(_sortKey(b));
      if (ka !== kb) return ka < kb ? -1 : 1;
    }
    return (b.w * b.h) - (a.w * a.h);
  });
  const BANDS = Math.max(10, Math.round(H0 / VH * CFG.bandsPerScreen));
  const placedArr = [];
  order.forEach((t, oi) => {
    t.placed = false;
    const band = oi % BANDS, bandH = H0 / BANDS;
    let ok = false;
    for (let k = 0; k < 800 && !ok; k++) {
      let x, y;
      if (placedArr.length && Math.random() < CFG.clusterBias) {
        const p = placedArr[(Math.random() * placedArr.length) | 0];
        x = p.cx + p.w / 2 + rnd(-1.3, 1.3) * (p.w / 2 + t.w / 2 + 14) - t.w / 2;
        y = p.cy + p.h / 2 + rnd(-1.2, 1.2) * (p.h / 2 + t.h / 2 + 14) - t.h / 2;
      } else {
        x = rnd(MX, W - t.w - MX);
        y = rnd(Math.max(E + RES, band * bandH - bandH * 0.45),
                Math.min(H0 - t.h - E - RES, (band + 1) * bandH + bandH * 0.45) + 1);
      }
      x = Math.min(Math.max(MX, x), Math.max(MX, W - t.w - MX));
      y = Math.min(Math.max(E + RES, y), H0 - t.h - E - RES);
      if (fits(x, y, t)) { t.cx = Math.round(x); t.cy = Math.round(y); ok = true; }
    }
    if (!ok) {                                          // 兜底：全卷逐行找位
      /* 步长必须小于「分离余量」，否则会跳过仍然够用的窄缝 → 明明有位却垫到画布底部。
         分离余量 = (gap+gap)/2 + 2*RES ≈ 25–40px，故步长取其一半量级（并按 tile 尺寸自适应）。
         此分支只对随机放置失败的极少数图块执行，故细扫成本可忽略。
         由 fixFallbackScan 开关控制：默认 false 保持 v23 的粗步长（v23 自带此缺陷）。 */
      const stepY = CFG.fixFallbackScan ? Math.max(8, Math.round(Math.min(t.h, 200) * 0.1))
                                        : Math.max(18, Math.round(t.h * 0.35));
      const stepX = CFG.fixFallbackScan ? Math.max(8, Math.round(Math.min(t.w, 200) * 0.1))
                                        : Math.max(20, Math.round(t.w * 0.45));

  if (emit("lightbox:before", { id: d.id, record: lbRecord, data: d }) === false) return;

const _hooks = {};
function on(name, fn){ (_hooks[name] = _hooks[name] || []).push(fn); return () => off(name, fn); }
function off(name, fn){ const a = _hooks[name]; if (a) { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); } }
function emit(name, payload){
  const a = _hooks[name]; let r;
  if (a) for (const fn of a) { try { const v = fn(payload); if (v === false) r = false; } catch (e) { console.warn("[playground] hook", name, e); } }

function relayout(kind, keyFn){
  emit("relayout:before", { kind });
  _sortKey = (kind && keyFn) ? keyFn : null;
  layout(); advance(_last || 0, 0.016);
  emit("relayout:after", { kind });
}
/* setTargets(map|fn)：设定重组目标锚点，配合 CFG.morph>0 平滑过渡 */
function setTargets(spec){
  for (const t of tiles) {
    if (typeof spec === "function") { const p = spec(t); if (p) { t.tx = p.x; t.ty = p.y; } }
    else if (spec && spec[t.id]) { t.tx = spec[t.id].x; t.ty = spec[t.id].y; }
  }
  if (CFG.morph <= 0) { layout(); advance(_last || 0, 0.016); }   /* morph=0：直接落位 */
}

  on, off, emit, tileById, relayout, setTargets, openLB, closeLB,
  get tiles(){ return tiles; },
  get records(){ return DATA; },
  get config(){ return CFG; },
  get canvasHeight(){ return parseFloat(FIELD.style.height) || 0; },
  layout(){ layout(); advance(_last || 0, 0.016); },
  setConfig(patch){ Object.assign(CFG, patch); layout(); advance(_last || 0, 0.016); },
  version: "v3.1"
};
window.Playground = Playground;
emit("ready", { api: Playground, count: tiles.length });

        setFocus(i);
      });
      track.appendChild(b);
    });

    var b = BADGE[g.status] || BADGE.uncertain;
    hd.innerHTML = '<span class="kb" style="color:' + b[1] + ';border-color:' + b[1] +
      '55;background:' + b[1] + '12">' + b[0] + '</span>' +
      '<span>同一生物 · 同发育期 · ' + STRIP.length + ' 个角度</span>' +
      '<span style="color:#6f757e">' + esc(g.label) + '</span>' +
      '<span style="color:#565a62">触控板滑动或点击平移</span>' +
      (PIN.on ? '<span style="color:#c39cf0">· 指认模式：点击可勾选</span>' : '');

    lb.classList.add("kinon");
    applyFocus(false);
  }

  /* ---------------- 平移几何 ---------------- */
  function figs() { return track ? track.querySelectorAll(".kinfig") : []; }
  function centerTarget(i) {
    var f = figs(), el = f[i];
    if (!el || !wrap) return 0;
    return wrap.clientWidth / 2 - (el.offsetLeft + el.offsetWidth / 2);
  }
  function bounds() {
    var f = figs(); if (!f.length) return { lo: 0, hi: 0 };
    var hi = centerTarget(0), lo = centerTarget(f.length - 1);
    return lo < hi ? { lo: lo, hi: hi } : { lo: hi, hi: lo };
  }
  function nearestIndex() {
    var f = figs(), best = 0, bd = Infinity;
    for (var i = 0; i < f.length; i++) {
      var c = f[i].offsetLeft + f[i].offsetWidth / 2 + PANX;
      var d = Math.abs(c - wrap.clientWidth / 2);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function applyPan() { track.style.transform = "translateX(" + PANX + "px)"; }

  function centerOn(idx, animate) {
    if (!wrap || !track) return;
    PANX = centerTarget(idx);
    if (animate === false) {
      track.style.transition = "none";
      applyPan();
      void track.offsetWidth;                 // 强制回流，跳过动画
      track.style.transition = "";
    } else {
      track.style.transition = "";            // 清掉滑动期间设的 none，让 CSS 过渡接管
      applyPan();
    }
  }

  /* 焦点图为什么不升级到 r.full（实测结论，勿再改回）：
     r.full 是**整帧**高清图（实测 2745×4117，比例 0.667），不是主体裁剪；
     而条带用的是主体居中裁剪（640×355，比例 1.803）。若焦点图换成 r.full：
       1. 生物回到整帧中的原始位置 → 重新出现用户报的「对不齐/很偏」；
       2. 长宽比从 1.8 跳到 0.67 → 焦点图突然变成竖长条，条带布局跳动；
       3. 实测焦点图显示仅约 423px 高（38vh × 1.22），640px 源是 0.66× **缩小**，
          根本不存在放大模糊。为此下载 2745×4117 是纯浪费。
     因此焦点放大只用 transform scale，不换图源。 */
  function applyFocus(animate) {
    var f = figs();
    for (var i = 0; i < f.length; i++) f[i].classList.toggle("focus", i === FOCUS);
    centerOn(FOCUS, animate);
    updateNav();
    paintStripPins();
  }

  function setFocus(idx) {
    if (idx < 0 || idx >= STRIP.length || idx === FOCUS) return;
    FOCUS = idx;
    applyFocus(true);
  }
  function stepFocus(d) { setFocus(Math.min(STRIP.length - 1, Math.max(0, FOCUS + d))); }

  /* ---------------- 触控板 / 滚轮：自由平移 + 抬手吸附 ---------------- */
  function bindWheel() {
    wrap.addEventListener("wheel", function (e) {
      if (!lb.classList.contains("kinon") || STRIP.length < 2) return;
      e.preventDefault();
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (!d) return;
      if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 400;
      d = Math.max(-160, Math.min(160, d));    // 单次事件限幅，防触控板惯性猛冲
      panBy(-d);
    }, { passive: false });
  }

  function panBy(delta) {
    var bd = bounds();
    PANX = Math.min(bd.hi, Math.max(bd.lo, PANX + delta));
    track.style.transition = "none";           // 跟手：平移期间关掉动画
    applyPan();
    wrap.classList.add("panning");
    var near = nearestIndex();                 // 滑动中即时更新焦点高亮（不居中）
    if (near !== FOCUS) {
      FOCUS = near;
      var f = figs();
      for (var i = 0; i < f.length; i++) f[i].classList.toggle("focus", i === FOCUS);
      updateNav();
    }
    clearTimeout(SNAP_T);
    SNAP_T = setTimeout(function () {           // 抬手（160ms 无新事件）→ 吸附居中
      SNAP_T = null;
      wrap.classList.remove("panning");
      centerOn(FOCUS, true);
    }, 160);
  }

  function updateNav() {
    if (!navL || !navR) return;
    navL.classList.toggle("has", FOCUS > 0);
    navR.classList.toggle("has", FOCUS < STRIP.length - 1);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ================= 指认模式（沿用 v2/v3，未改语义） ================= */
  var PIN = { on: false, picked: [] };
  var pinBtn = null, pinBar = null, expPanel = null, toastEl = null;

  function toast(msg, ok) {
    if (!toastEl) { toastEl = document.createElement("div"); toastEl.id = "kinToast"; document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.className = "on" + (ok ? " ok" : "");
    clearTimeout(toastEl._h); toastEl._h = setTimeout(function () { toastEl.className = ""; }, 2800);
  }

  function buildChrome() {
    if (!pinBtn) {
      pinBtn = document.createElement("button"); pinBtn.id = "pinBtn";
      pinBtn.title = "指认模式：点选几只生物，声明它们是同一只（或某只不属于本组）";
      pinBtn.textContent = "◎";
      pinBtn.addEventListener("click", togglePinMode);
      document.body.appendChild(pinBtn);
    }
    if (!pinBar) { pinBar = document.createElement("div"); pinBar.id = "pinBar"; document.body.appendChild(pinBar); }
    if (!expPanel) {
      expPanel = document.createElement("div"); expPanel.id = "expPanel";
      expPanel.innerHTML =
        '<div class="box"><h3>导出你的指认结果</h3>' +
        '<p>把下面这段 JSON 发给我（AI），我会据此更新分组数据并重新构建站点。' +
        '你的改动已即时生效在本页，也已存在浏览器里，不会丢。</p>' +
        '<textarea id="expTa" readonly></textarea>' +
        '<div class="row"><button class="pri" id="expCopy">复制</button>' +
        '<button id="expDl">下载 JSON</button><button id="expClose">关闭</button>' +
        '<button id="expReset" style="margin-left:auto;border-color:#6b3a3a;color:#e8b0b0">清空全部指认</button></div></div>';
      document.body.appendChild(expPanel);
      expPanel.addEventListener("click", function (e) { if (e.target === expPanel) closeExp(); });
      document.getElementById("expCopy").addEventListener("click", function () {
        var ta = document.getElementById("expTa"); ta.select();
        try { navigator.clipboard.writeText(ta.value); toast("已复制到剪贴板", true); }
        catch (e) { toast("请手动全选复制（Ctrl/⌘+C）"); }
      });
      document.getElementById("expDl").addEventListener("click", function () {
        var blob = new Blob([document.getElementById("expTa").value], { type: "application/json" });
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
        a.download = "kinship_corrections.json"; a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      });
      document.getElementById("expClose").addEventListener("click", closeExp);
      document.getElementById("expReset").addEventListener("click", function () {
        COR = { merge: [], remove: {} }; saveCOR(); reindex(); renderPinBar();
        if (curOpenId) buildStrip(curOpenId);
        paintFieldPins(); toast("已清空全部指认，恢复 AI 原分组");
      });
    }
  }
  function openExp() {
    buildChrome();
    document.getElementById("expTa").value = JSON.stringify(exportCorrections(), null, 1);
    expPanel.classList.add("on");
  }
  function closeExp() { expPanel.classList.remove("on"); }

  function togglePinMode() {
    buildChrome();
    PIN.on = !PIN.on;
    if (!PIN.on) PIN.picked = [];
    pinBtn.classList.toggle("on", PIN.on);
    pinBtn.textContent = PIN.on ? "◉" : "◎";
    document.getElementById("field").classList.toggle("pinmode", PIN.on);
    renderPinBar(); paintFieldPins(); paintStripPins();
    if (PIN.on) toast("指认模式：点击漂浮的生物选中它，选 2 只以上可声明「同一只」", true);
  }

  function renderPinBar() {
    if (!pinBar) return;
    if (!PIN.on) { pinBar.classList.remove("on"); return; }
    var n = PIN.picked.length, canMerge = n >= 2;
    var pg = {}; PIN.picked.forEach(function (id) { var g = IDX[id]; if (g) pg[g.id] = g; });
    var inGroup = Object.keys(pg);
    pinBar.classList.add("on");
    pinBar.innerHTML =
      '<span><b>指认模式</b> 已选 <span class="cnt">' + n + '</span> 只</span>' +
      '<button class="go" id="pbMerge" ' + (canMerge ? "" : "disabled") + '>声明为同一只生物</button>' +
      '<button id="pbRemove" ' + (n >= 1 && inGroup.length ? "" : "disabled") + '>移出所属分组</button>' +
      '<button id="pbClear" ' + (n ? "" : "disabled") + '>取消选择</button>' +
      '<button id="pbExport">导出反馈</button><button id="pbExit">退出</button>' +
      (inGroup.length ? '<span style="color:#8d949d">已选图所属组：' +
        inGroup.map(function (k) { return esc(pg[k].label); }).join("、") + '</span>' : '');
    document.getElementById("pbMerge").addEventListener("click", doMerge);
    document.getElementById("pbRemove").addEventListener("click", doRemove);
    document.getElementById("pbClear").addEventListener("click", function () {
      PIN.picked = []; renderPinBar(); paintFieldPins(); paintStripPins();
    });
    document.getElementById("pbExport").addEventListener("click", openExp);
    document.getElementById("pbExit").addEventListener("click", togglePinMode);
  }

  function togglePin(id) {
    var i = PIN.picked.indexOf(id);
    if (i >= 0) PIN.picked.splice(i, 1); else PIN.picked.push(id);
    renderPinBar(); paintFieldPins(); paintStripPins();
  }
  function paintFieldPins() {
    var ts = document.querySelectorAll("#field .tile");
    for (var i = 0; i < ts.length; i++) ts[i].classList.toggle("pinned", PIN.picked.indexOf(ts[i].dataset.id) >= 0);
  }
  function paintStripPins() {
    var f = figs();
    for (var i = 0; i < f.length; i++) f[i].classList.toggle("pinned", PIN.picked.indexOf(f[i].dataset.kid) >= 0);
  }

  function doMerge() {
    var ids = PIN.picked.slice(); if (ids.length < 2) return;
    var dup = COR.merge.some(function (s) { return s.ids.length === ids.length && ids.every(function (x) { return s.ids.indexOf(x) >= 0; }); });
    if (!dup) COR.merge.push({ ids: ids, at: new Date().toISOString(), source: "user_pin" });
    saveCOR(); reindex();
    var g = IDX[ids[0]];
    toast("已声明 " + ids.length + " 只为同一生物" + (g ? "（组：" + g.label + "）" : ""), true);
    PIN.picked = []; renderPinBar(); paintFieldPins(); paintStripPins();
    if (curOpenId) buildStrip(curOpenId);
  }
  function doRemove() {
    var n = 0;
    PIN.picked.forEach(function (id) {
      var g = IDX[id]; if (!g || g.origin === "user") return;
      var arr = COR.remove[g.id] || (COR.remove[g.id] = []);
      if (arr.indexOf(id) < 0) { arr.push(id); n++; }
    });
    if (!n) { toast("所选图不在任何 AI 分组内，无法移出"); return; }
    saveCOR(); reindex();
    toast("已把 " + n + " 只移出所属分组", true);
    PIN.picked = []; renderPinBar(); paintFieldPins(); paintStripPins();
    if (curOpenId) buildStrip(curOpenId);
  }

  function exportCorrections() {
    var nRem = Object.keys(COR.remove).reduce(function (s, k) { return s + COR.remove[k].length; }, 0);
    return {
      schema: "plankton-playground/kinship-corrections/v1",
      exported_at: new Date().toISOString(),
      site: "blackwater-plankton-archive (PlanktonTest 108)",
      counts: { merge_sets: COR.merge.length, removed_ids: nRem },
      note: ("merge = 用户声明这些图是同一只生物（可跨原有分组合并）；" +
             "remove = 用户声明该图不属于该 AI 分组。" +
             "AI 应据此更新 kinship.json 并重新注入站点。"),
      corrections: COR,
      effective_groups_snapshot: effectiveGroups().map(function (g) {
        return { id: g.id, label: g.label, status: g.status, origin: g.origin, members: g.members };
      })
    };
  }

  /* ---- 捕获阶段拦截场中点击：指认模式下不打开灯箱 ---- */
  var FIELD = document.getElementById("field");
  if (FIELD) {
    FIELD.addEventListener("click", function (e) {
      if (!PIN.on) return;
      var t = e.target.closest ? e.target.closest(".tile") : null;
      if (!t) return;
      e.stopPropagation(); e.preventDefault();
      togglePin(t.dataset.id);
    }, true);
  }

  /* ---- 键盘：← → 平移焦点；P 指认模式；Esc 退出/关闭 ---- */
  addEventListener("keydown", function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
    if ((e.key === "ArrowLeft") && lb && lb.classList.contains("kinon")) { e.preventDefault(); stepFocus(-1); return; }
    if ((e.key === "ArrowRight") && lb && lb.classList.contains("kinon")) { e.preventDefault(); stepFocus(1); return; }
    if (e.key === "p" || e.key === "P") { togglePinMode(); return; }
    if (e.key === "Escape") {
      if (expPanel && expPanel.classList.contains("on")) { closeExp(); e.stopImmediatePropagation(); }
      else if (PIN.on) { togglePinMode(); e.stopImmediatePropagation(); }
    }
  }, true);

  addEventListener("resize", function () { if (lb && lb.classList.contains("kinon")) centerOn(FOCUS, false); });

  /* ================= 挂载到既有钩子 ================= */
  var curOpenId = null;
  if (typeof on === "function") {
    on("lightbox:open", function (p) { curOpenId = p && p.id; buildStrip(curOpenId); });
    on("lightbox:close", function () {
      curOpenId = null;
      /* 防闪烁：#lb 有 .4s 淡出过渡。立即拆条带会让引擎单图 .frame 带着
         上一张主图重新可见并跟着淡出——那就是用户看到的 ~0.1s 闪烁。
         改为保留 .kinon（.frame 持续隐藏）至淡出结束后再清理。 */
      clearTimeout(CLOSE_T);
      CLOSE_T = setTimeout(function () { CLOSE_T = null; clearStage(); }, 460);
    });
  }
  buildChrome();

  window.PlaygroundKin = {
    version: "kin-4.1",
    groups: function () { return effectiveGroups(); },
    groupsCount: function () { return effectiveGroups().length; },
    corrections: function () { return COR; },
    exportCorrections: exportCorrections,
    pinMode: function (on) { if (!!on !== PIN.on) togglePinMode(); },
    strip: function () { return STRIP.slice(); },
    focusIndex: function () { return FOCUS; },
    panX: function () { return PANX; },
    setFocus: setFocus,
    note: "v4.1：回退主体裁剪，条带用整帧展示层+上一版尺寸；保留触控板平移吸附与无闪烁关闭。"
  };
})();

</script>
<!--KINSHIP_MOUNT_END-->

</body>

<script>
/* ================================================================
   ARCHIVE → WORKBENCH 链接层（实验版，只挂在实验副本上）
   ----------------------------------------------------------------
   作用：在档案站灯箱里提供一个极低调入口，跳到工作台并定位到同一张图。
   连接键：图片 id（两个平台共用同一套 id，已核实 108/108 一致）。
   传参方式：URL fragment（`workbench.html#img=<id>`）。
     为什么用 fragment 而不是 localStorage / postMessage：
       * 无状态、跨标签页、不依赖同源存储（file:// 下 localStorage 按目录分区，
         两个文件不同名，共享不可靠）；
       * 刷新后仍可复现（链接本身就是完整状态），也便于人把链接发给别人。

   不碰核心引擎、不碰 kinship 挂载：只用既有 lightbox:open/close 钩子，
   且把按钮挂在 document.body 上（不塞进 #lb 内部，避免被挂载层的清理逻辑波及）。

   沉浸约束（用户明确要求过）：**任何位置都不显示 image ID**。
   按钮文案是动作，不是数据；ID 只存在于跳转 URL 里。
   ================================================================ */
(function () {
  "use strict";

  /* 工作台地址：同目录相对路径。已实测 file:// 同目录跳转 + fragment 传参可用。
     若两个文件不同目录，把这里改成实际相对/绝对路径即可（见 references 说明）。 */
  var WB_URL = "workbench.html";

  var st = document.createElement("style");
  st.textContent = [
    "#wbLink{position:fixed;right:16px;bottom:64px;z-index:82;",
    "  display:none;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;",
    "  border:1px solid rgba(255,255,255,.14);background:rgba(12,12,14,.62);",
    "  color:#9aa0a8;font:11.5px/1 -apple-system,'PingFang SC',sans-serif;",
    "  text-decoration:none;cursor:pointer;opacity:.32;backdrop-filter:blur(6px);",
    "  transition:opacity .3s,border-color .3s,color .3s,transform .2s}",
    "#wbLink:hover{opacity:1;color:#dfe3e8;border-color:rgba(255,255,255,.34);transform:translateY(-1px)}",
    "#wbLink.on{display:inline-flex}",
    "#wbLink .ic{font-size:13px;line-height:1}",
    /* 指认按钮在 bottom:16，本按钮上移避开；条带打开时不遮挡左右箭头 */
    "@media(max-width:900px){#wbLink{right:12px;bottom:56px;padding:6px 11px}}"
  ].join("");
  document.head.appendChild(st);

  var a = document.createElement("a");
  a.id = "wbLink";
  /* target 必须存在：原生导航靠它开新标签。缺了它点击会**替换当前标签**，
     档案站的漂浮状态（滚动位置、随机尺寸、已加载的图）就全丢了。 */
  a.target = "_blank";
  a.rel = "noopener";
  a.title = "在工作台中核验这只生物（新标签打开，档案站保持不变）";
  a.innerHTML = '<span class="ic">⌕</span><span>在工作台核验</span>';
  document.body.appendChild(a);

  var cur = null;

  /* 用**原生锚点导航**而不是 window.open()。
     实测依据（CDP 捕获 Page.windowOpen 事件）：
       * 无用户手势调用 window.open → 返回 null，被拦（gesture=false）
       * 真实鼠标手势下 window.open → 成功（gesture=true）
       * 原生 <a target="_blank"> 点击 → 成功，且不依赖手势判定
     原生锚点更稳：不受弹窗拦截策略影响，还天然支持中键/⌘点击、
     右键「在新标签打开」、复制链接地址。故这里只维护 href，
     不做 preventDefault、不调用 window.open。 */
  function urlFor(id) {
    return WB_URL + "#img=" + encodeURIComponent(id) + "&from=archive";
  }

  /* 同标签跳转（用户明确要求「彻底离开档案站」时）：Alt/⌘+点击 */
  a.addEventListener("click", function (e) {
    if (e.altKey || e.metaKey) {
      e.preventDefault();
      if (cur) location.href = urlFor(cur);
    }
    /* 其余情况不拦截：让浏览器执行原生 target="_blank" 导航 */
  });

  if (typeof on === "function") {
    on("lightbox:open", function (p) {
      cur = p && p.id;
      if (!cur) return;
      a.href = urlFor(cur);          // 原生导航所需
      a.classList.add("on");
    });
    on("lightbox:close", function () {
      cur = null;
      a.removeAttribute("href");
      a.classList.remove("on");
    });
  }

  window.PlaygroundLink = {
    version: "link-0.2-experiment",
    direction: "archive→workbench",
    target: WB_URL,
    current: function () { return cur; },
    url: function () { return cur ? urlFor(cur) : null; },
    /* 供测试与未来程序化调用（注意：程序化 window.open 无手势会被拦，
       测试须用真实鼠标手势或读取 a.href 断言） */
    open: function (newTab) {
      if (!cur) return null;
      var u = urlFor(cur);
      if (newTab === false) { location.href = u; return u; }
      return window.open(u, "_blank", "noopener");
    },
    note: "实验版单向链接（档案站→工作台），原生锚点导航。反向与查询链接（L2）尚未实现。"
  };
})();

</script>
<!--LINK_EXP_END-->
